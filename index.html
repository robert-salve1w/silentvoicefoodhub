<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Silent Bite · Order silently, Eat Happily</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ========== LANDING PAGE - RED THEME BACKGROUND ========== -->
    <div class="landing-page">
      <div class="landing-card">
        <!-- Logo centered above the text -->
        <div class="logo-centered">
          <div class="logo-icon-large">
            <img
              src="images/silentvoicefoodhubLogo.jpg"
              alt="Silent Voice Food Hub Logo"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 50%;
              "
            />
          </div>
        </div>
        <div class="logo-text-centered">Silent Voice Food Hub</div>
        <div class="tagline-landing">✨ Order silently, Eat Happily ✨</div>
        <div class="btn-group">
          <a href="menu.html" class="btn btn-start">🍜 START ORDER</a>
          <button class="btn btn-pref" id="openPrefLanding">
            ⚙️ SET DIETARY PREFERENCES
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
