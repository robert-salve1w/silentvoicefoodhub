<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Reviews and Ratings · Silent Voice</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ratings-page">
      <!-- Header with back arrow -->
      <div class="ratings-header-bar">
        <a href="menu.html" class="back-arrow">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="ratings-header-title">Reviews and Ratings</div>
        <div style="width: 40px"></div>
      </div>

      <!-- Dish Name -->
      <div class="ratings-dish-name" id="ratingsPageTitle"></div>

      <!-- Rating Summary -->
      <div id="ratingSummary" class="rating-summary"></div>

      <!-- Review Filters -->
      <div class="review-filters">
        <button
          class="filter-btn active"
          data-filter="top"
          onclick="filterReviews('top')"
        >
          Top reviews
        </button>
        <button
          class="filter-btn"
          data-filter="newest"
          onclick="filterReviews('newest')"
        >
          Newest
        </button>
        <button
          class="filter-btn"
          data-filter="highest"
          onclick="filterReviews('highest')"
        >
          Highest rating
        </button>
        <button
          class="filter-btn"
          data-filter="lowest"
          onclick="filterReviews('lowest')"
        >
          Lowest rating
        </button>
      </div>

      <!-- Write Review Section -->
      <div class="write-review-section">
        <h3>⭐ Write a Review</h3>
        <div
          style="
            display: flex;
            gap: 4px;
            font-size: 2rem;
            cursor: pointer;
            margin: 0.5rem 0;
          "
          id="starSelector"
        >
          <span
            data-star="1"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(1)"
            onmouseover="previewStar(1)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="2"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(2)"
            onmouseover="previewStar(2)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="3"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(3)"
            onmouseover="previewStar(3)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="4"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(4)"
            onmouseover="previewStar(4)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="5"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(5)"
            onmouseover="previewStar(5)"
            onmouseout="resetStarPreview()"
            >★</span
          >
        </div>

        <!-- Fixed input row -->
        <div class="review-input-row">
          <input
            type="text"
            id="reviewCommentInput"
            placeholder="Share your experience..."
            class="review-comment-input"
          />
          <button id="submitReviewBtn" class="review-submit-btn" disabled>
            Submit
          </button>
        </div>

        <div
          id="ratingMessage"
          style="
            color: #dc143c;
            font-size: 0.8rem;
            display: none;
            margin-top: 4px;
          "
        >
          Please select a rating first
        </div>
      </div>

      <!-- Reviews List -->
      <div id="reviewsList" class="reviews-list"></div>
    </div>

    <!-- Review Submit Modal -->
    <div
      id="reviewSubmitModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 3000;
        backdrop-filter: blur(5px);
      "
    >
      <!-- Modal content here (same as before) -->
    </div>

    <!-- 🔥 Bottom Navigation - OUTSIDE .ratings-page -->
    <div class="bottom-bar">
      <button class="nav-icon" data-nav="menu">
        <span>🍽️</span>
        <span>Menu</span>
      </button>
      <button class="nav-icon" data-nav="cart" style="position: relative">
        <span>🛒</span>
        <span>Cart</span>
        <span
          id="navCartBadge"
          class="cart-badge"
          style="position: absolute; top: -8px; right: -10px; display: none"
          >0</span
        >
      </button>
      <button class="nav-icon" data-nav="ratings">
        <span>⭐</span>
        <span>Rate</span>
      </button>
      <button class="nav-icon" data-nav="orderslip" style="position: relative">
        <span>🧾</span>
        <span>OrderSlip</span>
        <span
          id="orderSlipBadge"
          class="nav-badge"
          style="
            position: absolute;
            top: -8px;
            right: -10px;
            background: #dc143c;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            text-align: center;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            z-index: 10;
          "
          >0</span
        >
      </button>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="ratings.js"></script>
  </body>
</html>
