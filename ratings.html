<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Reviews and Ratings · Silent Voice</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ratings-page">
      <!-- Header -->
      <div class="ratings-header-bar">
        <a href="menu.html" class="back-arrow">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="ratings-title" id="ratingsPageTitle">
          Reviews and Ratings
        </div>
        <div style="width: 40px"></div>
      </div>

      <!-- Rating Summary (includes rating + bars in split layout) -->
      <div id="ratingSummary" class="rating-summary"></div>

      <!-- Review Filters -->
      <div class="review-filters">
        <button
          class="filter-btn active"
          data-filter="top"
          onclick="filterReviews('top')"
        >
          Top reviews
        </button>
        <button
          class="filter-btn"
          data-filter="newest"
          onclick="filterReviews('newest')"
        >
          Newest
        </button>
        <button
          class="filter-btn"
          data-filter="highest"
          onclick="filterReviews('highest')"
        >
          Highest rating
        </button>
        <button
          class="filter-btn"
          data-filter="lowest"
          onclick="filterReviews('lowest')"
        >
          Lowest rating
        </button>
      </div>

      <!-- Write Review Section -->
      <div class="write-review-section">
        <h3>⭐ Write a Review</h3>
        <div
          style="
            display: flex;
            gap: 4px;
            font-size: 2rem;
            cursor: pointer;
            margin: 0.5rem 0;
          "
          id="starSelector"
        >
          <span
            data-star="1"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(1)"
            onmouseover="previewStar(1)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="2"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(2)"
            onmouseover="previewStar(2)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="3"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(3)"
            onmouseover="previewStar(3)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="4"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(4)"
            onmouseover="previewStar(4)"
            onmouseout="resetStarPreview()"
            >★</span
          >
          <span
            data-star="5"
            style="color: #ddd; transition: color 0.2s; cursor: pointer"
            onclick="selectStar(5)"
            onmouseover="previewStar(5)"
            onmouseout="resetStarPreview()"
            >★</span
          >
        </div>
        <div
          style="
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 0.5rem;
          "
        >
          <input
            type="text"
            id="reviewCommentInput"
            placeholder="Share your experience..."
            style="
              flex: 1;
              padding: 0.8rem 1rem;
              border: 1.5px solid #e0e0e0;
              border-radius: 12px;
              font-size: 0.9rem;
              font-family: inherit;
              outline: none;
            "
            onfocus="this.style.borderColor = '#dc143c'"
            onblur="this.style.borderColor = '#e0e0e0'"
          />
          <button
            id="submitReviewBtn"
            style="
              padding: 0.8rem 1.5rem;
              background: #dc143c;
              color: white;
              border: none;
              border-radius: 12px;
              font-weight: 600;
              font-size: 0.85rem;
              cursor: pointer;
              font-family: &quot;Inter&quot;, sans-serif;
              opacity: 0.5;
              pointer-events: none;
              transition: opacity 0.2s;
            "
            disabled
          >
            Submit
          </button>
        </div>
        <div
          id="ratingMessage"
          style="color: #dc143c; font-size: 0.8rem; display: none"
        >
          Please select a rating first
        </div>
      </div>

      <!-- Reviews List -->
      <div id="reviewsList" class="reviews-list"></div>

      <!-- Review Submit Modal -->
      <div
        id="reviewSubmitModal"
        style="
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.7);
          align-items: center;
          justify-content: center;
          z-index: 3000;
          backdrop-filter: blur(5px);
        "
      >
        <div
          style="
            background: white;
            max-width: 420px;
            width: 92%;
            border-radius: 24px;
            padding: 2rem 1.5rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            font-family: &quot;Inter&quot;, sans-serif;
            animation: slideUp 0.3s ease;
          "
        >
          <h3
            style="
              font-size: 1.2rem;
              font-weight: 700;
              color: #2c2b28;
              margin-bottom: 0.5rem;
            "
          >
            ⭐ Submit Review
          </h3>
          <p style="color: #888; font-size: 0.85rem; margin-bottom: 1rem">
            Please confirm your review details
          </p>

          <!-- Review Summary -->
          <div
            style="
              background: #f8f5f0;
              border-radius: 12px;
              padding: 1rem;
              margin-bottom: 1.2rem;
            "
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 6px;
                font-size: 0.9rem;
              "
            >
              <span style="color: #666">Rating:</span>
              <span
                id="modalRatingDisplay"
                style="font-weight: 600; color: #f5a623"
                >★★★★★</span
              >
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 0.9rem;
              "
            >
              <span style="color: #666">Comment:</span>
              <span
                id="modalCommentDisplay"
                style="
                  font-weight: 500;
                  color: #333;
                  text-align: right;
                  max-width: 60%;
                "
                >Your comment here</span
              >
            </div>
          </div>

          <!-- Name Selection - Like Staff Decline Modal -->
          <div style="margin-bottom: 1.2rem">
            <label
              style="
                display: block;
                font-weight: 600;
                font-size: 0.9rem;
                color: #333;
                margin-bottom: 8px;
              "
            >
              👤 Choose how to display your name:
            </label>

            <div style="display: flex; flex-direction: column; gap: 8px">
              <!-- Option 1: Use Customer # -->
              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  padding: 10px 14px;
                  border: 2px solid #28a745;
                  border-radius: 12px;
                  cursor: pointer;
                  transition: all 0.2s;
                  background: #f0fff0;
                "
                onmouseover="
                  this.style.borderColor = '#28a745';
                  this.style.background = '#e8ffe8';
                "
                onmouseout="
                  if (!this.querySelector('input').checked) {
                    this.style.borderColor = '#e0e0e0';
                    this.style.background = '#fafafa';
                  }
                "
              >
                <input
                  type="radio"
                  name="nameOption"
                  value="customer"
                  checked
                  onchange="toggleNameOption('customer')"
                  style="
                    width: 18px;
                    height: 18px;
                    accent-color: #28a745;
                    cursor: pointer;
                  "
                />
                <span style="font-size: 0.9rem">🔢 Use Customer #</span>
              </label>

              <!-- Option 2: Your Name (optional) -->
              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  padding: 10px 14px;
                  border: 2px solid #e0e0e0;
                  border-radius: 12px;
                  cursor: pointer;
                  transition: all 0.2s;
                  background: #fafafa;
                "
                onmouseover="
                  this.style.borderColor = '#dc143c';
                  this.style.background = '#fff5f5';
                "
                onmouseout="
                  if (!this.querySelector('input').checked) {
                    this.style.borderColor = '#e0e0e0';
                    this.style.background = '#fafafa';
                  }
                "
              >
                <input
                  type="radio"
                  name="nameOption"
                  value="custom"
                  onchange="toggleNameOption('custom')"
                  style="
                    width: 18px;
                    height: 18px;
                    accent-color: #dc143c;
                    cursor: pointer;
                  "
                />
                <span style="font-size: 0.9rem">✏️ Your Name (optional)</span>
              </label>
            </div>
          </div>

          <!-- Custom Name Input (hidden by default) -->
          <div
            id="customNameContainer"
            style="display: none; margin-bottom: 1.2rem"
          >
            <label
              style="
                display: block;
                font-weight: 600;
                font-size: 0.85rem;
                color: #333;
                margin-bottom: 6px;
              "
            >
              Enter your name:
            </label>
            <input
              type="text"
              id="reviewerNameInput"
              placeholder="Type your name here..."
              style="
                width: 100%;
                padding: 0.8rem 1rem;
                border: 1.5px solid #e0e0e0;
                border-radius: 12px;
                font-size: 0.9rem;
                font-family: &quot;Inter&quot;, sans-serif;
                outline: none;
                transition: border-color 0.2s;
              "
              onfocus="this.style.borderColor = '#dc143c'"
              onblur="this.style.borderColor = '#e0e0e0'"
            />
            <p style="font-size: 0.7rem; color: #999; margin-top: 4px">
              💡 Leave blank to use Customer #
            </p>
          </div>

          <div style="display: flex; gap: 12px">
            <button
              onclick="closeReviewModal()"
              style="
                flex: 1;
                background: #e0e0e0;
                color: #555;
                border: none;
                padding: 0.8rem;
                border-radius: 40px;
                font-weight: 600;
                font-size: 0.95rem;
                cursor: pointer;
                font-family: &quot;Inter&quot;, sans-serif;
                transition: all 0.2s;
              "
              onmouseover="this.style.background = '#d0d0d0'"
              onmouseout="this.style.background = '#e0e0e0'"
            >
              Cancel
            </button>
            <button
              onclick="confirmSubmitReview()"
              style="
                flex: 1;
                background: #dc143c;
                color: white;
                border: none;
                padding: 0.8rem;
                border-radius: 40px;
                font-weight: 600;
                font-size: 0.95rem;
                cursor: pointer;
                font-family: &quot;Inter&quot;, sans-serif;
                transition: all 0.2s;
              "
              onmouseover="this.style.background = '#b22222'"
              onmouseout="this.style.background = '#dc143c'"
            >
              Confirm Submit
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottom-bar">
        <button class="nav-icon" data-nav="menu">
          <span>🍽️</span>
          <span>Menu</span>
        </button>
        <button class="nav-icon" data-nav="cart" style="position: relative">
          <span>🛒</span>
          <span>Cart</span>
          <span
            id="navCartBadge"
            class="cart-badge"
            style="position: absolute; top: -8px; right: -10px; display: none"
            >0</span
          >
        </button>
        <button class="nav-icon" data-nav="payment">
          <span>💳</span>
          <span>Payment</span>
        </button>
        <button
          class="nav-icon"
          data-nav="orderslip"
          style="position: relative"
        >
          <span>🧾</span>
          <span>OrderSlip</span>
          <span
            id="orderSlipBadge"
            class="nav-badge"
            style="
              position: absolute;
              top: -8px;
              right: -10px;
              background: #dc143c;
              color: white;
              font-size: 0.65rem;
              font-weight: 700;
              padding: 2px 6px;
              border-radius: 50%;
              min-width: 20px;
              height: 20px;
              text-align: center;
              display: none;
              align-items: center;
              justify-content: center;
              border: 2px solid white;
              z-index: 10;
            "
            >0</span
          >
        </button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="ratings.js"></script>
  </body>
</html>
