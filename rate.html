<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Silent Bite · Rate Dishes</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="rate-page">
      <!-- Header -->
      <div class="rate-header-bar">
        <a href="menu.html" class="back-arrow">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="rate-title">⭐ Rate Your Dishes</div>
        <div style="width: 40px"></div>
      </div>

      <!-- Info Banner -->
      <div
        style="
          margin: 1rem;
          padding: 0.8rem 1rem;
          background: linear-gradient(135deg, #fff8e1, #ffe9c4);
          border-radius: 16px;
          border-left: 4px solid #f5a623;
          font-size: 0.8rem;
          color: #6b4a00;
        "
      >
        💡 Rate the dishes you've ordered! Your feedback helps us improve.
      </div>

      <!-- Pending Ratings Container -->
      <div id="rateContainer" class="rate-container">
        <!-- Dishes to rate will be injected here -->
      </div>

      <!-- Empty State -->
      <div
        id="emptyRateMessage"
        class="empty-rate-message"
        style="display: none"
      >
        <span>⭐</span>
        <p>No dishes to rate yet</p>
        <p class="empty-subtitle">
          Complete an order and you can rate your dishes here
        </p>
        <a href="menu.html" class="btn-start-order">Browse Menu</a>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottom-bar">
        <button class="nav-icon" data-nav="menu">
          <span>🍽️</span>
          <span>Menu</span>
        </button>
        <button class="nav-icon" data-nav="cart" style="position: relative">
          <span>🛒</span>
          <span>Cart</span>
          <span
            id="navCartBadge"
            class="cart-badge"
            style="position: absolute; top: -8px; right: -10px; display: none"
            >0</span
          >
        </button>
        <button
          class="nav-icon active"
          data-nav="rate"
          style="position: relative"
        >
          <span>⭐</span>
          <span>Rate</span>
          <span
            id="rateBadge"
            class="nav-badge"
            style="
              position: absolute;
              top: -8px;
              right: -10px;
              background: #f5a623;
              color: white;
              font-size: 0.65rem;
              font-weight: 700;
              padding: 2px 6px;
              border-radius: 50%;
              min-width: 20px;
              height: 20px;
              text-align: center;
              display: none;
              align-items: center;
              justify-content: center;
              border: 2px solid white;
              z-index: 10;
            "
            >0</span
          >
        </button>
        <button
          class="nav-icon"
          data-nav="orderslip"
          style="position: relative"
        >
          <span>🧾</span>
          <span>OrderSlip</span>
          <span
            id="orderSlipBadge"
            class="nav-badge"
            style="
              position: absolute;
              top: -8px;
              right: -10px;
              background: #dc143c;
              color: white;
              font-size: 0.65rem;
              font-weight: 700;
              padding: 2px 6px;
              border-radius: 50%;
              min-width: 20px;
              height: 20px;
              text-align: center;
              display: none;
              align-items: center;
              justify-content: center;
              border: 2px solid white;
              z-index: 10;
            "
            >0</span
          >
          <span
            id="orderSlipActiveBadge"
            class="nav-badge-active"
            style="
              position: absolute;
              top: -8px;
              left: -10px;
              background: #007bff;
              color: white;
              font-size: 0.65rem;
              font-weight: 700;
              padding: 2px 6px;
              border-radius: 50%;
              min-width: 20px;
              height: 20px;
              text-align: center;
              display: none;
              align-items: center;
              justify-content: center;
              border: 2px solid white;
              z-index: 10;
            "
            >0</span
          >
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
