<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Silent Bite · Order Slip</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orderslip-page">
      <!-- Header with back arrow -->
      <div class="orderslip-header-bar">
        <a href="menu.html" class="back-arrow">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="orderslip-title">Order Slip</div>
        <div style="width: 40px"></div>
      </div>

      <!-- 🔥 DATE FILTER FOR ORDER SLIP -->
      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin: 1rem;
          flex-wrap: wrap;
          background: white;
          padding: 0.8rem 1rem;
          border-radius: 12px;
          border: 1px solid #ffcdcd;
        "
      >
        <span style="font-weight: 600; font-size: 0.85rem; color: #555"
          >📅 Filter:</span
        >

        <select
          id="orderslipDateFilter"
          onchange="applyOrderslipDateFilter()"
          style="
            padding: 6px 14px;
            border-radius: 30px;
            border: 2px solid #dc143c;
            background: white;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: &quot;Inter&quot;, sans-serif;
            cursor: pointer;
            color: #333;
            min-width: 130px;
            outline: none;
            flex: 1;
          "
        >
          <option value="all">All Orders</option>
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="thisweek">This Week</option>
          <option value="thismonth">This Month</option>
          <option value="thisyear">This Year</option>
          <option value="custom">Custom Date</option>
        </select>
      </div>

      <!-- Custom Date Range (hidden by default) -->
      <div
        id="orderslipCustomDateRange"
        style="
          display: none;
          align-items: center;
          gap: 8px;
          margin: 0 1rem 1rem;
          flex-wrap: wrap;
          background: white;
          padding: 0.8rem 1rem;
          border-radius: 12px;
          border: 1px solid #ffcdcd;
        "
      >
        <label style="font-size: 0.75rem; color: #666">From:</label>
        <input
          type="date"
          id="orderslipCustomDateFrom"
          style="
            padding: 5px 10px;
            border-radius: 20px;
            border: 1.5px solid #e0e0e0;
            font-family: &quot;Inter&quot;, sans-serif;
            font-size: 0.75rem;
            flex: 1;
            min-width: 100px;
          "
        />
        <label style="font-size: 0.75rem; color: #666">To:</label>
        <input
          type="date"
          id="orderslipCustomDateTo"
          style="
            padding: 5px 10px;
            border-radius: 20px;
            border: 1.5px solid #e0e0e0;
            font-family: &quot;Inter&quot;, sans-serif;
            font-size: 0.75rem;
            flex: 1;
            min-width: 100px;
          "
        />
        <button
          onclick="applyOrderslipCustomDateRange()"
          style="
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            background: #dc143c;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: &quot;Inter&quot;, sans-serif;
            width: 100%;
          "
        >
          Apply Filter
        </button>
      </div>

      <!-- Filter Status Display -->
      <div
        id="orderslipFilterStatus"
        style="
          text-align: center;
          font-size: 0.75rem;
          color: #888;
          margin: 0 1rem 1rem;
          padding: 0.5rem;
          background: #fff8f0;
          border-radius: 20px;
          display: none;
        "
      >
        Showing: <strong id="orderslipFilterLabel">All Orders</strong>
      </div>

      <!-- Order Slips Container -->
      <div id="orderslipContainer" class="orderslip-container">
        <!-- Order slips will be injected here -->
      </div>

      <!-- Empty State Message -->
      <div
        id="emptyOrderslipMessage"
        class="empty-orderslip-message"
        style="display: none"
      >
        <span>📋</span>
        <p>No order slips yet</p>
        <p class="empty-subtitle">
          Complete a payment to see your order history
        </p>
        <a href="menu.html" class="btn-start-order">Start Ordering</a>
      </div>

      <!-- Empty State for Date Filter -->
      <div
        id="emptyFilteredOrderslipMessage"
        class="empty-orderslip-message"
        style="display: none"
      >
        <span>📅</span>
        <p>No orders found for this date range</p>
        <p class="empty-subtitle">Try selecting a different date filter</p>
        <button
          onclick="resetOrderslipDateFilter()"
          style="
            margin-top: 1rem;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: none;
            background: #dc143c;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: &quot;Inter&quot;, sans-serif;
          "
        >
          Show All Orders
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
