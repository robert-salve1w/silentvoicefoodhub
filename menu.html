<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <title>Silent Bite · Menu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="menu-page">
      <!-- Header with back arrow + logo -->
      <div class="menu-header">
        <a href="index.html" class="back-arrow">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="header-logo">
          <img src="images/silentvoicefoodhubLogo.jpg" alt="Silent Voice Food Hub" style="height: 32px; width: auto; vertical-align: middle; border-radius: 50%;">
    <span style="vertical-align: middle; margin-left: 8px;">Silent Voice Food Hub</span>
    <small style="vertical-align: middle; font-size: 0.6rem; color: #888;">| silent bites</small>
        </div>
        <div style="width: 30px"></div>
      </div>

      <!-- Recommended section -->
      <div class="rec-banner" id="recBanner">
        <div class="rec-title">⭐ Recommended for you</div>
        <div class="rec-tags" id="recTagsContainer"></div>
        <div class="rec-items" id="recItemsList"></div>
      </div>

      <!-- Menu categories - ADDED Sandwiches and Salads tabs -->
      <div class="categories" id="categoryTabs">
        <button data-cat="all" class="cat-btn active">All</button>
        <button data-cat="Rice Meals" class="cat-btn">Rice Meals</button>
        <button data-cat="Sandwiches" class="cat-btn">Sandwiches</button>
        <button data-cat="Salads" class="cat-btn">Salads</button>
        <button data-cat="Snacks" class="cat-btn">Snacks</button>
        <button data-cat="Drinks" class="cat-btn">Drinks</button>
        <button data-cat="Desserts" class="cat-btn">Desserts</button>
      </div>

      <!-- Menu grid -->
      <div id="menuGrid" class="menu-grid"></div>

      <<!-- Bottom Navigation Bar -->
<div class="bottom-bar">
  <button class="nav-icon" data-nav="menu">
    <span>🍽️</span>
    <span>Menu</span>
  </button>
  <button class="nav-icon" data-nav="cart" style="position: relative">
    <span>🛒</span>
    <span>Cart</span>
    <span id="navCartBadge" class="cart-badge" style="position: absolute; top: -8px; right: -10px; display: none">0</span>
  </button>
  <button class="nav-icon" data-nav="payment">
    <span>💳</span>
    <span>Payment</span>
  </button>
  <button class="nav-icon" data-nav="orderslip" style="position: relative">
    <span>🧾</span>
    <span>OrderSlip</span>
    <!-- 🔥 NEW: Notification badge for order slip -->
    <span id="orderSlipBadge" class="nav-badge" style="
      position: absolute;
      top: -8px;
      right: -10px;
      background: #dc143c;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      text-align: center;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      z-index: 10;
    ">0</span>
  </button>
</div>

    <script src="script.js"></script>
  </body>
</html>
